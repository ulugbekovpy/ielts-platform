<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sahifa topilmadi | IELTSPro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --brand-blue: #2563eb;       
            --brand-dark: #0b1329;       
            --text-main: #0f172a;
            --text-muted: #64748b;
            --radius-lg: 24px;
            --radius-md: 12px;
            --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Декоративные фоновые круги с размытием */
        .bg-glow-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.1) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.08) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        @keyframes float-reverse {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(10px) rotate(-4deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3), 0 0 0 0px rgba(37, 99, 235, 0.2); }
            70% { box-shadow: 0 15px 30px rgba(37, 99, 235, 0.4), 0 0 0 12px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3), 0 0 0 0px rgba(37, 99, 235, 0); }
        }

        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .error-container {
            max-width: 580px;
            width: 100%;
            text-align: center;
            background: #ffffff;
            padding: 50px 40px;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(15, 23, 42, 0.06);
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.04);
            z-index: 10;
            animation: scaleUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
        }

        /* Логотип */
        .logo {
            font-size: 28px;
            font-weight: 800;
            color: var(--brand-dark);
            margin-bottom: 30px;
            letter-spacing: -1px;
        }
        .logo span {
            color: var(--brand-blue);
        }

        /* Графика ошибки */
        .art-wrapper {
            position: relative;
            height: 180px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .big-404 {
            font-size: 110px;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, var(--brand-dark) 0%, #1e293b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -4px;
            position: relative;
            user-select: none;
        }

        /* Парящие иконки */
        .floating-icon {
            position: absolute;
            font-size: 26px;
            color: var(--brand-blue);
            background: #eff6ff;
            width: 54px;
            height: 54px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.08);
            border: 1px solid rgba(37, 99, 235, 0.1);
        }

        .icon-book {
            top: 15px;
            left: 20%;
            animation: float 4s ease-in-out infinite;
        }

        .icon-headphones {
            bottom: 15px;
            right: 20%;
            animation: float-reverse 4.5s ease-in-out infinite;
        }

        /* Описание */
        h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--brand-dark);
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 36px;
            padding: 0 10px;
        }

        /* Сочная Кнопка */
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--brand-blue) 0%, #1d4ed8 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 36px;
            font-size: 16px;
            font-weight: 700;
            border-radius: var(--radius-md);
            transition: var(--transition-smooth);
            animation: pulseGlow 2s infinite;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
        }

        .btn-home i {
            transition: var(--transition-smooth);
        }

        .btn-home:hover i {
            transform: translateX(-3px);
        }

        @media (max-width: 520px) {
            .error-container { padding: 40px 20px; }
            .big-404 { font-size: 85px; }
            .floating-icon { width: 44px; height: 44px; font-size: 20px; }
            .icon-book { left: 10%; }
            .icon-headphones { right: 10%; }
            h1 { font-size: 20px; }
            p { font-size: 14px; }
            .btn-home { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="error-container">
        <!-- Логотип платформы -->
        <div class="logo">IELTS<span>Pro</span></div>

        <!-- Арт-зона -->
        <div class="art-wrapper">
            <div class="floating-icon icon-book">
                <i class="fas fa-book-open"></i>
            </div>
            <div class="big-404">404</div>
            <div class="floating-icon icon-headphones">
                <i class="fas fa-headphones-alt"></i>
            </div>
        </div>

        <!-- Контент -->
        <h1>Oops! Sahifa topilmadi</h1>
        <p>Siz qidirayotgan sahifa o'chirilgan, nomi o'zgartirilgan yoki vaqtincha mavjud bo'lmasligi mumkin. Keling, sizni asosiy yo'nalishga qaytaramiz!</p>

        <!-- Сочная Кнопка возврата -->
        <a href="{% url 'dashboard' %}" class="btn-home">
            <i class="fas fa-arrow-left"></i> Bosh sahifaga qaytish
        </a>
    </div>

</body>
</html>
